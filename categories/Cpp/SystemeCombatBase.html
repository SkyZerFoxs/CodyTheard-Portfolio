                <h1 data-en="Base Combat System" data-fr="Système de combat de base">Système de combat de base</h1>
                <p class="preserve-whitespace" data-en="In this prototype built in Unreal Engine using C++, I implemented the foundations of a simple combat system:
🔹Character movement in C++
🔹Sword attack triggered by a player action
🔹Health point (HP) management on a target cube
🔹Damage system: each hit removes 1 HP
🔹Object destruction after 5 hits (HP = 0)
🎯 Project objective: to explore gameplay logic directly in C++, without using Blueprints, in order to strengthen my understanding of low-level programming in Unreal Engine.

This prototype is a first step toward more complex mechanics (enemy management, AI, advanced combat systems).
Prototype created in October 2025 (1 week)"
 data-fr="Dans ce prototype réalisé sous Unreal Engine en C++, j’ai implémenté les fondations d’un système de combat simple :
🔹Déplacement du personnage en C++
🔹Attaque à l’épée déclenchée par une action du joueur
🔹Gestion des points de vie (HP) sur un cube cible
🔹Système de dégâts : chaque coup retire 1 HP
🔹Destruction de l’objet après 5 coups (HP = 0)
🎯 Objectif du projet : explorer la logique gameplay directement en C++, sans passer par Blueprint, afin de renforcer ma compréhension de la programmation bas niveau dans Unreal Engine.

Ce prototype constitue une première étape vers des mécaniques plus complexes (gestion d’ennemis, IA, systèmes de combat évolués).
Prototype créé en octobre 2025 (1 semaine)">
