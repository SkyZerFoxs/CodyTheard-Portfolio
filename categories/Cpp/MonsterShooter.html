                <h1>Monster Shooter</h1>
                <p class="preserve-whitespace" data-en="This prototype was developed entirely in C++, starting from a blank project, without using any Unreal Engine templates. The goal was to follow a YouTube tutorial to understand the basics of gameplay programming in C++.
Implemented features:
🔹Complete implementation of the Character, Enemy, and Projectile classes
🔹Player movement, jumping, and shooting
🔹Damage system for the player and enemies
🔹Dynamic health bars
🔹Player and enemy death after losing health points
🎯 Project objective: to learn how to structure a complete gameplay system in C++ by building all the basic systems of an action game without using Blueprints or default templates.

Prototype created in October 2025 (1 month)"
 data-fr="Ce prototype a été développé entièrement en C++, à partir d’un projet vide, sans utiliser de template Unreal Engine. L’objectif était de suivre un tutoriel YouTube pour comprendre les bases de la programmation gameplay en C++.
Fonctionnalités implémentées :
🔹Création complète des classes Character, Enemy et Projectile
🔹Déplacement, saut et tir du joueur
🔹Système de dégâts pour le joueur et les ennemis
🔹Barres de vie dynamiques
🔹Mort du joueur et de l’ennemi après perte de points de vie
🎯 Objectif du projet : apprendre à structurer un gameplay complet en C++, en construisant tous les systèmes de base d’un jeu d’action sans recourir à Blueprint ni aux templates par défaut.

Prototype créé en octobre 2025 (1 mois)">
                </p>
