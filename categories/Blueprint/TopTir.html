                <h1>Top Down Shooter Prototype</h1>
                <p class="preserve-whitespace" 
                data-en="This top-down shooter was developed using Unreal Engine to deliver an immersive and strategic experience. The player controls a character positioned in the center of a hexagonal arena, surrounded by enemies advancing toward them. The objective of the game is to survive as long as possible by dodging enemy attacks and using weapons to eliminate them. The game features a health point system, real-time scoring, and dynamic design with engaging gameplay elements. This project demonstrates the use of strategy-based game mechanics, as well as user interface management and 3D level creation in Unreal Engine.
Prototype developed in November 2024 (1 month)." 
                data-fr="Ce jeu de tir en vue de haut a été conçu avec Unreal Engine pour offrir une expérience immersive et stratégique. Le joueur contrôle un personnage situé au centre d'une arène hexagonale, entourée d'ennemis qui avancent vers lui. Le but du jeu est de survivre le plus longtemps possible en évitant les attaques des ennemis et en utilisant des armes pour les éliminer. Le jeu inclut un système de points de vie, un score en temps réel et un design dynamique avec des éléments de gameplay engageants. Ce projet démontre l’utilisation des mécaniques de jeu basées sur la stratégie, ainsi que la gestion de l'interface utilisateur et la création de niveaux 3D dans Unreal Engine.
Prototype developpé en Novembre 2024  (1 mois).">
                </p>
