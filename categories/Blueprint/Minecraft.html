🔹Basic blocks: dirt, grass, sand, coal, stone.
🔹Procedural foliage and trees: adds vegetation for a more vibrant world.
🔹Procedural systems: generation of caves and varied biomes, with a chunk surface based on procedural noise.
🔹Interaction with the world: mining and placing blocks.
🔹World generation: dynamic creation of worlds with multiple biomes.
🔹Chunk management: optimized chunk loading and unloading for smooth performance.
This project showcases my skills in procedural programming and managing dynamic environments with Unreal Engine. An excellent example of technical and creative work combined!"

🔹Systèmes procéduraux : génération de grottes et de biomes variés, avec une surface de chunk basée sur le bruit procédural.
🔹Interaction avec le monde : minage et placement de blocs.
🔹Génération de mondes : création dynamique de mondes avec plusieurs biomes.
🔹Gestion des chunks : chargement et déchargement optimisé des chunks pour une performance fluide.
