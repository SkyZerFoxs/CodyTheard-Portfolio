            <div class="DescriptionGame">
                <h1>Horror Prototype</h1>
                <p class="preserve-whitespace" 
                data-en="This horror game plunges you into the dark and tense world of an abandoned spaceship. You play as a character trapped aboard the ship, where you must navigate through various narrow spaces to survive. The main objective is to retrieve an access card from the control room while avoiding attacks from hostile alien creatures patrolling the corridors. Use the airlocks as safe havens to escape enemies and avoid certain death. With a tense atmosphere and immersive setting, this game emphasizes suspense, stress management, and the search for key items to progress through the story. The project showcases the use of 3D environment creation and the implementation of gameplay mechanics based on survival and psychological horror in Unreal Engine. Prototype developed in October 2024 (1 month)" 
                data-fr="Ce jeu d'horreur vous plonge dans l'univers sombre et tendu d'un vaisseau spatial abandonné. Le joueur incarne un personnage pris au piège à bord du vaisseau, où il doit naviguer à travers différents espaces étroits pour survivre. L'objectif principal est de récupérer une carte d'accès dans la salle des commandes tout en évitant les attaques de créatures extraterrestres hostiles qui patrouillent dans les couloirs. Utilisez les sas comme zones de refuge pour échapper aux ennemis et éviter une mort certaine. Avec une ambiance oppressante et une atmosphère immersive, ce jeu met l'accent sur le suspense, la gestion du stress et la recherche d'objets clés pour progresser dans l'histoire. Le projet illustre l'utilisation de la création d'environnements 3D et la mise en œuvre de mécaniques de gameplay basées sur la survie et l'horreur psychologique dans Unreal Engine. Prototype developpé en Octobre 2024 (1 mois)">
                </p>
