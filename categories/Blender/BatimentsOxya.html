                <p class="preserve-whitespace"
                    data-en="As part of my Oxya project, I created several buildings and decorative elements using Blender. These 3D models were designed to seamlessly integrate into the game's universe, adhering to a consistent aesthetic that matches Oxya's visual style. I employed various modeling, texturing, and animation techniques to bring these structures to life, ensuring they are both functional and visually appealing for gameplay. These creations were integrated into the Unreal Engine game engine, where they contribute to creating an immersive and captivating atmosphere for players.
                    
                    Created in January 2026"
                    data-fr="Dans le cadre de mon projet Oxya, j’ai créé plusieurs bâtiments et éléments de décor en utilisant Blender. Ces modèles 3D ont été conçus pour s’intégrer parfaitement dans l’univers du jeu, en respectant une esthétique cohérente avec le style visuel d’Oxya. J’ai utilisé diverses techniques de modélisation, de texturing et d’animation pour donner vie à ces structures, en veillant à ce qu’elles soient à la fois fonctionnelles et esthétiques pour le gameplay. Ces créations ont été intégrées dans le moteur de jeu Unreal Engine, où elles contribuent à créer une atmosphère immersive et captivante pour les joueurs.
                    
                    Créé en Janvier 2026">
